services:
  - type: web
    name: poojaspace
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
